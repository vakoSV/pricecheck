<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#4fb69a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Georgian household-goods prices (dazoge.info) and a supplier-price margin calculator.">
  <title>PriceCheck</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- iPhone: full screen from the home screen; the green header runs under the status bar -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PriceCheck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="PriceCheck">
  <script>
    // keep Chrome's install offer for our own "Install app" button (the module loads later)
    addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__installEvent = e; });
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/search.js">
</head>
<body>
  <header class="top">
    <div class="hrow"><a class="brand" href="#/">PriceCheck</a>
      <button type="button" class="btn sm inst" data-install hidden>Install app</button></div>
    <div class="info" id="info"></div>
  </header>
  <div class="banner" id="newdata" hidden>New prices are available. <button type="button" class="btn sm" onclick="location.reload()">Reload</button></div>
  <div class="banner ios" id="iosbanner" hidden>
    <span>Install PriceCheck: tap Share <b aria-label="the Share button">⬆</b> then <b>Add to Home Screen</b></span>
    <button type="button" class="x" id="iosx" aria-label="Close">✕</button>
  </div>
  <main id="view">
    <div class="loading"><div class="spin"></div><p>Loading…</p></div>
  </main>
  <footer class="foot">
    <a href="#/install">How to install the app</a>
    <div class="qrcard" id="qrcard"><div id="qrbox"></div><div><b>Open on phone</b><small>Scan with the phone camera:<br>vakosv.github.io/pricecheck</small></div></div>
  </footer>
  <nav class="tabs-bottom" aria-label="Main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>Search</a>
    <a href="#/compare" data-tab="compare"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Compare</a>
    <a href="#/changes" data-tab="changes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>Changes</a>
    <a href="#/my" data-tab="my"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My products</a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg>Settings</a>
  </nav>
  <noscript><p style="padding:16px">This site needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
