<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price check</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #e3e3dc; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #2c2c2a; --card: #1e1e1d; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 8vh auto; padding: 0 16px; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .k { color: var(--muted); font-size: .85rem; }
    .v { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .s { color: var(--muted); font-size: .85rem; }
    h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .err { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <h1>Price check</h1>
    <p class="sub">Georgian household-goods prices from dazoge.info. The full site is coming soon.</p>

    <div class="grid">
      <div class="card"><div class="k">Last full update</div><div class="v" id="full">–</div></div>
      <div class="card"><div class="k">Last quick update</div><div class="v" id="quick">–</div></div>
      <div class="card"><div class="k">Products listed</div><div class="v" id="count">–</div><div class="s" id="count2"></div></div>
      <div class="card"><div class="k">Changes in last run</div><div class="v" id="changes">–</div><div class="s" id="changes2"></div></div>
    </div>

    <h2>Official exchange rates (National Bank of Georgia)</h2>
    <table>
      <thead><tr><th>Currency</th><th class="n">GEL per 1 unit</th><th>Valid from</th></tr></thead>
      <tbody id="rates"><tr><td colspan="3">–</td></tr></tbody>
    </table>
    <p class="s" id="msg"></p>
  </main>
  <script>
    const fmt = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tbilisi" }) : "never";
    const get = (f) => fetch("data/" + f + "?t=" + Date.now()).then((r) => { if (!r.ok) throw new Error(f + ": HTTP " + r.status); return r.json(); });
    get("meta.json").then((m) => {
      document.getElementById("full").textContent = fmt(m.last_full_update);
      document.getElementById("quick").textContent = fmt(m.last_quick_update);
      document.getElementById("count").textContent = m.products_active.toLocaleString("en-GB");
      document.getElementById("count2").textContent = m.products_not_listed ? m.products_not_listed + " no longer listed" : "";
      const c = m.last_run.changes;
      document.getElementById("changes").textContent = c.baseline ? "first run" : c.products_changed;
      document.getElementById("changes2").textContent = c.baseline ? "baseline, nothing to compare" :
        c.price_changes + " price changes, " + c.new + " new, " + c.disappeared + " gone (" + m.last_run.mode + " run)";
      const r = m.rates;
      document.getElementById("rates").innerHTML = r && r.rates ? Object.entries(r.rates).map(([k, v]) =>
        "<tr><td>" + k + "</td><td class='n'>" + v.toFixed(4) + "</td><td>" + r.valid_from + "</td></tr>").join("") :
        "<tr><td colspan='3'>not available</td></tr>";
    }).catch((e) => { document.getElementById("msg").innerHTML = "<span class='err'>No data published yet.</span>"; console.error(e); });
  </script>
</body>
</html>
