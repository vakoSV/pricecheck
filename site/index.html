<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#4fb69a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Georgian household-goods prices (dazoge.info) and a supplier-price margin calculator.">
  <title>PriceCheck</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- iPhone: full screen from the home screen; the green header runs under the status bar -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PriceCheck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="PriceCheck">
  <script>
    // keep Chrome's install offer for our own "Install app" button (the module loads later)
    addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__installEvent = e; });
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/search.js">
</head>
<body>
  <header class="top">
    <div class="hrow"><a class="brand" href="#/">PriceCheck</a>
      <span class="hbtns"><button type="button" class="btn sm inst" data-install hidden data-i18n="install.button"></button>
      <span class="langsw" role="group" data-i18n-aria="app.language"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="ka" lang="ka">ქა</button></span></span></div>
    <div class="info" id="info"></div>
  </header>
  <div class="banner" id="newdata" hidden><span data-i18n="app.new_data"></span> <button type="button" class="btn sm" onclick="location.reload()" data-i18n="app.reload"></button></div>
  <div class="banner ios" id="iosbanner" hidden>
    <span data-i18n-html="install.ios_banner"></span>
    <button type="button" class="x" id="iosx" data-i18n-aria="common.close">✕</button>
  </div>
  <main id="view">
    <div class="loading"><div class="spin"></div><p></p></div>
  </main>
  <footer class="foot">
    <a href="#/install" data-i18n="install.footer_link"></a>
    <div class="qrcard" id="qrcard"><div id="qrbox" role="img" data-i18n-aria="install.qr_aria"></div><div><b data-i18n="install.qr_title"></b><small><span data-i18n="install.qr_hint"></span><br>vakosv.github.io/pricecheck</small></div></div>
  </footer>
  <nav class="tabs-bottom" data-i18n-aria="nav.main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span data-i18n="nav.search"></span></a>
    <a href="#/compare" data-tab="compare"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav.compare"></span></a>
    <a href="#/changes" data-tab="changes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg><span data-i18n="nav.changes"></span></a>
    <a href="#/my" data-tab="my"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-i18n="nav.my"></span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg><span data-i18n="nav.settings"></span></a>
  </nav>
  <noscript><p style="padding:16px">This site needs JavaScript. · ამ საიტს JavaScript სჭირდება.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
