<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price check</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 15vh auto; padding: 0 16px; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; }
    p { color: var(--muted); margin: .25rem 0; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Price check, coming soon</h1>
    <p>Latest test run: <strong>{{LAST_TEST_RUN}}</strong></p>
    <p>Result: {{TEST_RESULT}} (<a href="{{RUN_URL}}">run log</a>)</p>
  </main>
</body>
</html>
